stages:
  - test

# Unit tests and type checks of the Python package (hand-built cases, no data needed)
test:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  variables:
    UV_CACHE_DIR: .uv-cache
    UV_LINK_MODE: copy
  cache:
    key: uv-$CI_COMMIT_REF_SLUG
    paths:
      - .uv-cache
  script:
    - uv sync --extra ethics
    - uv run pytest -q
    - uv run mypy tests
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
