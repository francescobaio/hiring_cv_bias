[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hiring_cv_bias" 
version = "0.1.0"
description = "Analysis and mitigation of bias in CVs"
authors = [
    { name = "Francesco Baiocchi", email = "francesco.baiocchi2@studio.unibo.it" },
    { name = "Leonardo Petrilli", email = "leonardo.petrilli@studio.unibo.it" }
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.11"

# Shared by both notebook sets; pick the set to run with an extra:
#   uv sync --extra ethics        -> notebooks/ethics
#   uv sync --extra ai-industry   -> notebooks/ai_in_industry
dependencies = [
  "polars==1.29.0",
  "fastexcel==0.13.0",
  "pyarrow>=19.0.0", 
  "numpy>=2.0",
  "matplotlib>=3.9",
  "ipykernel>=6.0.0",
]

[project.optional-dependencies]
ethics = [
  "scipy>=1.13.1",
  "langcodes==3.5.0",
  "language-data==1.3.0",
  "lingua-language-detector>=2.1.1",
  "sentence-transformers==5.0.0",
  "torch",  # CPU build, see [tool.uv.sources]
]
ai-industry = [
  "scipy>=1.13.1",
  "langcodes==3.5.0",
  "language-data==1.3.0",
  "sentence-transformers==5.0.0",
  "torch",  # CPU build, see [tool.uv.sources]
  "transformers==4.52.4",
  "beautifulsoup4==4.13.3",
  "requests==2.32.3",
  "seaborn==0.13.2",
  "polars-ds>=0.10.0",
  "langdetect==1.0.9",
  "pycountry==24.6.1",
  "nltk>=3.9.1",
  "spacy>=3.8.7",
  "streamlit==1.44.0",
  "tqdm",
  "ipywidgets>=8.1.7",
]
translation = [
  "google-cloud-translate==3.26.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pre-commit",
  "nbstripout",
  "ruff==0.16.9",
  "mypy",
  "types-requests",
]

# CPU-only torch: the CUDA build from PyPI adds ~5 GB of nvidia-* wheels
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length is handled by ruff format

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["."]
