[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hiring_cv_bias" 
version = "0.1.0"
description = "Analysis and mitigation of bias in CVs"
authors = [
    { name = "Francesco Baiocchi", email = "francesco.baiocchi2@studio.unibo.it" },
    { name = "Leonardo Petrilli", email = "leonardo.petrilli@studio.unibo.it" }
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  "beautifulsoup4==4.13.3",
  "matplotlib==3.8.3",
  "polars==1.29.0",
  "requests==2.32.3",
  "seaborn==0.13.2",
  "fastexcel==0.13.0",
  "ipykernel>=6.0.0",
  "langdetect==1.0.9",
  "pycountry==24.6.1",
  "langcodes==3.5.0",
  "language-data==1.3.0",
  "pandas>=2.2.3",
  "transformers==4.52.4",
  "ipywidgets>=8.1.7",
  "scipy>=1.13.1",
  "polars-ds>=0.10.0",
  "sentence-transformers==5.0.0",
  "streamlit==1.44.0",
  "jupyter>=1.1.1",
  "nltk>=3.9.1",
  "spacy>=3.8.7",
  "scikit-learn>=1.5",
  "fairlearn>=0.12",
  "shap>=0.46",
]


[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pre-commit",
  "nbstripout",
  "ruff==0.16.9",
  "mypy",
  "types-requests",
]
translation = [
  "google-cloud-translate==3.26.0",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length is handled by ruff format

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["."]
